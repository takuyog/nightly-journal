<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nightly Journal - 今日の振り返りと明日の行動</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        night: {
                            bg: '#0B0F19',
                            card: '#151C2C',
                            input: '#1A2336',
                            border: '#2A364F',
                            text: '#E2E8F0',
                            muted: '#94A3B8',
                            accent: '#3B82F6',
                            accentHover: '#2563EB'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0F19;
        }
        ::-webkit-scrollbar-thumb {
            background: #2A364F;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3B82F6;
        }
    </style>
</head>
<body class="bg-[#0B0F19] text-slate-200 min-h-screen lg:h-screen font-sans antialiased selection:bg-blue-600 selection:text-white flex flex-col overflow-y-auto lg:overflow-hidden">

    <!-- ヘッダーエリア -->
    <header class="bg-[#0B0F19]/95 backdrop-blur-md border-b border-slate-800 px-3 py-2.5 shrink-0 z-30 sticky top-0">
        <div class="max-w-[1600px] mx-auto flex items-center justify-between gap-2">
            <!-- 日付選択 & ナビゲーション -->
            <div class="flex items-center gap-1.5">
                <button id="prev-day-btn" class="p-1.5 rounded-lg bg-slate-800/60 hover:bg-slate-700 text-slate-300 transition" title="前日へ">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
                <div class="relative flex items-center bg-slate-800/50 border border-slate-700/60 rounded-xl px-2.5 py-1">
                    <i data-lucide="calendar" class="w-4 h-4 text-blue-400 mr-1.5"></i>
                    <input type="date" id="date-picker" class="bg-transparent text-slate-100 font-semibold text-sm sm:text-base focus:outline-none cursor-pointer">
                </div>
                <button id="next-day-btn" class="p-1.5 rounded-lg bg-slate-800/60 hover:bg-slate-700 text-slate-300 transition" title="翌日へ">
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
                <button id="today-btn" class="text-xs bg-blue-900/40 hover:bg-blue-800/60 text-blue-300 border border-blue-700/50 px-2.5 py-1.5 rounded-lg font-medium transition">
                    今日
                </button>
            </div>

            <!-- バックアップ・保存機能 -->
            <div class="flex items-center gap-2">
                <button id="export-data-btn" class="p-2 rounded-xl bg-slate-800/60 hover:bg-slate-700 text-slate-300 border border-slate-700/50 transition text-xs flex items-center gap-1" title="全データを保存">
                    <i data-lucide="download" class="w-4 h-4 text-emerald-400"></i>
                    <span class="hidden md:inline">バックアップ</span>
                </button>
                <label class="p-2 rounded-xl bg-slate-800/60 hover:bg-slate-700 text-slate-300 border border-slate-700/50 transition text-xs flex items-center gap-1 cursor-pointer" title="データの復元">
                    <i data-lucide="upload" class="w-4 h-4 text-amber-400"></i>
                    <span class="hidden md:inline">復元</span>
                    <input type="file" id="import-data-file" accept=".json" class="hidden">
                </label>
                <button id="manual-save-btn" class="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl text-xs sm:text-sm font-medium shadow-lg shadow-blue-900/30 transition active:scale-95">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    <span>保存</span>
                </button>
            </div>
        </div>

        <!-- スマホ専用：上部タブナビゲーション（画面幅1023px以下で表示） -->
        <nav class="lg:hidden flex items-center justify-around border-t border-slate-800/80 pt-2 mt-2">
            <button onclick="switchMobileTab('tasks')" id="nav-btn-tasks" class="mobile-nav-btn flex items-center justify-center gap-1.5 py-1.5 px-3 rounded-lg text-slate-400 font-medium text-xs transition w-1/3">
                <i data-lucide="check-square" class="w-4 h-4"></i>
                <span>タスク</span>
            </button>
            <button onclick="switchMobileTab('journal')" id="nav-btn-journal" class="mobile-nav-btn active flex items-center justify-center gap-1.5 py-1.5 px-3 rounded-lg text-blue-400 bg-blue-900/30 border border-blue-500/30 font-medium text-xs transition w-1/3">
                <i data-lucide="book-open" class="w-4 h-4"></i>
                <span>振り返り</span>
            </button>
            <button onclick="switchMobileTab('insights')" id="nav-btn-insights" class="mobile-nav-btn flex items-center justify-center gap-1.5 py-1.5 px-3 rounded-lg text-slate-400 font-medium text-xs transition w-1/3">
                <i data-lucide="sparkles" class="w-4 h-4"></i>
                <span>気づき</span>
            </button>
        </nav>
    </header>

    <!-- 3分割メインエリア (PC: 3カラム常時表示 / スマホ: 1カラム縦一列スクロール) -->
    <div class="flex-1 max-w-[1600px] w-full mx-auto p-3 sm:p-4 md:p-6 lg:grid lg:grid-cols-12 gap-6 lg:overflow-hidden lg:h-[calc(100vh-65px)]">

        <!-- 1. タスク管理エリア (PC: 3/12 / スマホ: タブ1) -->
        <aside id="tab-tasks" class="mobile-tab-content hidden lg:flex lg:col-span-3 flex-col h-full overflow-hidden">
            <div class="bg-[#151C2C] border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col h-full overflow-hidden">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3 shrink-0">
                    <h2 class="text-base sm:text-lg font-bold text-slate-100 flex items-center gap-2">
                        <i data-lucide="check-square" class="w-5 h-5 text-blue-400"></i>
                        常時タスク一覧
                    </h2>
                </div>

                <!-- タスク追加入力 -->
                <div class="mb-3 space-y-2 shrink-0">
                    <input type="text" id="task-input" 
                        class="w-full bg-[#1A2336] border border-slate-700/70 rounded-xl px-3 py-2 text-slate-100 text-sm placeholder-slate-500 focus:outline-none focus:border-blue-500"
                        placeholder="追加するタスクを入力">
                    
                    <div class="flex items-center gap-2">
                        <div class="relative flex-1">
                            <select id="task-target-date-type" class="w-full bg-[#1A2336] border border-slate-700/70 text-slate-200 text-xs rounded-xl px-2.5 py-2 focus:outline-none focus:border-blue-500 cursor-pointer">
                                <option value="today">表示中の日（今日）やる</option>
                                <option value="tomorrow" selected>明日やる 🌙</option>
                                <option value="custom">日付を指定...</option>
                            </select>
                        </div>
                        <input type="date" id="task-custom-date" class="hidden bg-[#1A2336] border border-slate-700/70 text-slate-200 text-xs rounded-xl px-2 py-1.5 focus:outline-none">
                        <button id="add-task-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-3.5 py-2 rounded-xl transition text-xs sm:text-sm shrink-0">
                            追加
                        </button>
                    </div>
                </div>

                <!-- 凡例 -->
                <div class="flex items-center gap-2 text-[10px] text-slate-400 pb-2 border-b border-slate-800/60 mb-2 shrink-0 flex-wrap">
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-500"></span>今日</span>
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-purple-500"></span>未来・明日</span>
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-500"></span>持ち越し</span>
                </div>

                <!-- スクロール可能なタスクエリア -->
                <div class="flex-1 overflow-y-auto space-y-2.5 pr-1" id="tasks-list">
                    <!-- タスク要素 -->
                </div>
            </div>
        </aside>

        <!-- 2. 振り返りノート (PC: 6/12 / スマホ: タブ2 - 縦一列縦スクロール) -->
        <main id="tab-journal" class="mobile-tab-content flex flex-col lg:col-span-6 space-y-5 lg:overflow-y-auto lg:h-full pr-0 lg:pr-2 pb-12">
            <div class="border-b border-slate-800 pb-2 flex items-center justify-between sticky top-0 bg-[#0B0F19]/90 backdrop-blur-md pt-1 z-10">
                <h2 class="text-lg sm:text-xl font-bold text-slate-100 flex items-center gap-2">
                    <i data-lucide="book-open" class="w-5 h-5 sm:w-6 sm:h-6 text-blue-400"></i>
                    今日の振り返りノート
                </h2>
                <!-- 共有ボタン -->
                <button id="share-btn" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-blue-400 border border-blue-500/30 px-2.5 py-1.5 rounded-xl text-xs font-medium transition">
                    <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
                    <span>共有</span>
                </button>
            </div>

            <!-- 感想 -->
            <div class="bg-[#151C2C] border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                <label class="block text-sm sm:text-base font-semibold text-slate-200 mb-2 flex items-center gap-2">
                    <i data-lucide="message-square" class="w-4 h-4 text-blue-400"></i>
                    今日の感想
                </label>
                <textarea id="reflection-journal" rows="4" 
                    class="w-full bg-[#1A2336] border border-slate-700/70 rounded-xl p-3.5 text-slate-100 text-sm sm:text-base leading-relaxed placeholder-slate-500 focus:outline-none focus:border-blue-500"
                    placeholder="今日あったこと、感じたことを書いてみよう"></textarea>
            </div>

            <!-- 気づいたこと -->
            <div class="bg-[#151C2C] border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                <label class="block text-sm sm:text-base font-semibold text-slate-200 mb-2 flex items-center gap-2">
                    <i data-lucide="lightbulb" class="w-4 h-4 text-amber-400"></i>
                    気づいたこと 💡
                </label>
                <textarea id="reflection-insights" rows="4" 
                    class="w-full bg-[#1A2336] border border-slate-700/70 rounded-xl p-3.5 text-slate-100 text-sm sm:text-base leading-relaxed placeholder-slate-500 focus:outline-none focus:border-amber-500"
                    placeholder="今日気づいたこと・学んだことは？"></textarea>
            </div>

            <!-- 課題と解決策（セット追加機能） -->
            <div class="bg-[#151C2C] border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl space-y-3">
                <label class="block text-sm sm:text-base font-semibold text-slate-200 flex items-center gap-2">
                    <i data-lucide="wrench" class="w-4 h-4 text-purple-400"></i>
                    課題と解決策 🎯
                </label>

                <!-- 課題セット追加フォーム -->
                <div class="bg-[#1A2336] p-3 sm:p-4 rounded-xl border border-slate-700/60 space-y-2.5">
                    <div class="space-y-1">
                        <span class="text-[11px] text-purple-300 font-medium">現在の課題</span>
                        <input type="text" id="issue-input" 
                            class="w-full bg-[#0B0F19] border border-slate-700 rounded-lg px-3 py-2 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-purple-500"
                            placeholder="例：集中力が途切れやすい">
                    </div>
                    <div class="space-y-1">
                        <span class="text-[11px] text-emerald-300 font-medium">解決策</span>
                        <input type="text" id="solution-input" 
                            class="w-full bg-[#0B0F19] border border-slate-700 rounded-lg px-3 py-2 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-emerald-500"
                            placeholder="例：25分作業して5分休むポモドーロテクニックを使う">
                    </div>
                    <button id="add-issue-pair-btn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-medium py-2 rounded-lg text-xs sm:text-sm transition flex items-center justify-center gap-1.5">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i>
                        <span>課題と解決策を追加</span>
                    </button>
                </div>

                <!-- 登録済み課題＆解決策リスト -->
                <div id="issue-pairs-list" class="space-y-2.5"></div>
            </div>

            <!-- よかったこと -->
            <div class="bg-[#151C2C] border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                <label class="block text-sm sm:text-base font-semibold text-slate-200 mb-2 flex items-center gap-2">
                    <i data-lucide="smile" class="w-4 h-4 text-emerald-400"></i>
                    よかったこと 😊
                </label>
                <textarea id="reflection-good" rows="4" 
                    class="w-full bg-[#1A2336] border border-slate-700/70 rounded-xl p-3.5 text-slate-100 text-sm sm:text-base leading-relaxed placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                    placeholder="うまくいったこと、嬉しかったことは？"></textarea>
            </div>

            <!-- AIに相談する アクションセクション -->
            <div class="bg-gradient-to-br from-[#182238] to-[#121827] border border-blue-500/30 rounded-2xl p-4 sm:p-5 shadow-2xl space-y-3">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                    <div class="flex items-center gap-2">
                        <div class="p-2 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-500/30">
                            <i data-lucide="bot" class="w-5 h-5 text-blue-400"></i>
                        </div>
                        <div>
                            <h3 class="text-sm sm:text-base font-bold text-slate-100">AIアドバイザーに相談</h3>
                            <p class="text-[11px] text-slate-400">客観的な分析、課題の改善案、実践的フィードバックをお届けします</p>
                        </div>
                    </div>
                    <button id="ask-ai-btn" class="w-full sm:w-auto bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium px-4 py-2.5 rounded-xl transition text-xs sm:text-sm flex items-center justify-center gap-1.5 shadow-lg shadow-blue-900/40 shrink-0 active:scale-95">
                        <i data-lucide="sparkles" class="w-4 h-4 text-amber-300"></i>
                        <span>AIに相談する ✨</span>
                    </button>
                </div>

                <!-- AIの出力テキストエリア -->
                <div id="ai-response-container" class="hidden space-y-2 pt-1">
                    <div class="bg-[#151C2C]/90 border border-slate-700/60 rounded-xl p-4 text-slate-200 text-xs sm:text-sm leading-relaxed whitespace-pre-wrap font-sans" id="ai-response-text">
                        <!-- AIの具体的かつ客観的な回答 -->
                    </div>
                </div>
            </div>
        </main>

        <!-- 3. 気づき一覧タイムライン (PC: 3/12 / スマホ: タブ3) -->
        <aside id="tab-insights" class="mobile-tab-content hidden lg:flex lg:col-span-3 flex-col h-full overflow-hidden">
            <div class="bg-[#151C2C] border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col h-full overflow-hidden">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3 shrink-0">
                    <h2 class="text-base sm:text-lg font-bold text-slate-100 flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-5 h-5 text-amber-400"></i>
                        学び・気づきタイムライン
                    </h2>
                </div>

                <!-- スクロール可能な「気づき」タイムライン -->
                <div class="flex-1 overflow-y-auto space-y-3 pr-1" id="insights-timeline">
                    <!-- タイムライン要素 -->
                </div>
            </div>
        </aside>

    </div>

    <!-- 通知トースト -->
    <div id="toast" class="fixed bottom-6 right-4 sm:right-6 bg-emerald-600 text-white px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2.5 transform translate-y-20 opacity-0 transition-all duration-300 z-50 text-xs sm:text-sm">
        <i data-lucide="check-circle" class="w-4 h-4"></i>
        <span id="toast-message" class="font-medium">保存しました！</span>
    </div>

    <!-- JavaScript -->
    <script>
        const STORAGE_KEY = 'nightly_journal_data_v2';
        let currentDateStr = getTodayString();
        let appData = loadData();

        // DOM Elements
        const datePicker = document.getElementById('date-picker');
        const prevDayBtn = document.getElementById('prev-day-btn');
        const nextDayBtn = document.getElementById('next-day-btn');
        const todayBtn = document.getElementById('today-btn');

        const reflectionJournal = document.getElementById('reflection-journal');
        const reflectionInsights = document.getElementById('reflection-insights');
        const reflectionGood = document.getElementById('reflection-good');

        const issueInput = document.getElementById('issue-input');
        const solutionInput = document.getElementById('solution-input');
        const addIssuePairBtn = document.getElementById('add-issue-pair-btn');
        const issuePairsList = document.getElementById('issue-pairs-list');

        const taskInput = document.getElementById('task-input');
        const taskTargetDateType = document.getElementById('task-target-date-type');
        const taskCustomDate = document.getElementById('task-custom-date');
        const addTaskBtn = document.getElementById('add-task-btn');
        const tasksList = document.getElementById('tasks-list');
        const insightsTimeline = document.getElementById('insights-timeline');

        const askAiBtn = document.getElementById('ask-ai-btn');
        const aiResponseContainer = document.getElementById('ai-response-container');
        const aiResponseText = document.getElementById('ai-response-text');

        const manualSaveBtn = document.getElementById('manual-save-btn');
        const exportDataBtn = document.getElementById('export-data-btn');
        const importDataFile = document.getElementById('import-data-file');
        const shareBtn = document.getElementById('share-btn');
        const toast = document.getElementById('toast');

        document.addEventListener('DOMContentLoaded', () => {
            datePicker.value = currentDateStr;
            renderAll();
            setupEventListeners();
        });

        function getTodayString() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        function getOffsetDateString(baseDateStr, offsetDays) {
            const d = new Date(baseDateStr);
            d.setDate(d.getDate() + offsetDays);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : {};
            } catch (e) {
                console.error(e);
                return {};
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            } catch (e) {
                console.error(e);
            }
        }

        function getOrCreateDayData(dateStr) {
            if (!appData[dateStr]) {
                appData[dateStr] = { journal: '', insights: '', good: '', tasks: [], issuePairs: [], aiAnalysis: '' };
            }
            if (!appData[dateStr].issuePairs) {
                appData[dateStr].issuePairs = [];
            }
            return appData[dateStr];
        }

        function renderAll() {
            const dayData = getOrCreateDayData(currentDateStr);
            reflectionJournal.value = dayData.journal || '';
            reflectionInsights.value = dayData.insights || '';
            reflectionGood.value = dayData.good || '';

            if (dayData.aiAnalysis) {
                aiResponseText.textContent = dayData.aiAnalysis;
                aiResponseContainer.classList.remove('hidden');
            } else {
                aiResponseContainer.classList.add('hidden');
            }

            renderIssuePairs();
            renderTasks();
            renderInsightsTimeline();
            lucide.createIcons();
        }

        // スマホ用上部タブ切り替え関数
        window.switchMobileTab = function(tabName) {
            document.querySelectorAll('.mobile-tab-content').forEach(el => {
                el.classList.add('hidden');
                el.classList.remove('flex');
            });

            document.querySelectorAll('.mobile-nav-btn').forEach(btn => {
                btn.classList.remove('text-blue-400', 'bg-blue-900/30', 'border', 'border-blue-500/30');
                btn.classList.add('text-slate-400');
            });

            const targetContent = document.getElementById(`tab-${tabName}`);
            const targetNav = document.getElementById(`nav-btn-${tabName}`);

            if (targetContent) {
                targetContent.classList.remove('hidden');
                targetContent.classList.add('flex');
            }
            if (targetNav) {
                targetNav.classList.remove('text-slate-400');
                targetNav.classList.add('text-blue-400', 'bg-blue-900/30', 'border', 'border-blue-500/30');
            }
        };

        function renderIssuePairs() {
            const dayData = getOrCreateDayData(currentDateStr);
            issuePairsList.innerHTML = '';

            if (!dayData.issuePairs || dayData.issuePairs.length === 0) {
                issuePairsList.innerHTML = `<div class="text-center py-3 bg-[#1A2336]/40 rounded-xl text-slate-500 text-xs">登録された課題・解決策はありません</div>`;
                return;
            }

            dayData.issuePairs.forEach((pair) => {
                const card = document.createElement('div');
                card.className = 'p-3 bg-[#1A2336] border border-slate-700/60 rounded-xl space-y-1.5 relative group';
                card.innerHTML = `
                    <button onclick="deleteIssuePair('${pair.id}')" class="absolute top-2 right-2 text-slate-500 hover:text-rose-400 p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
                    <div class="text-xs text-purple-300 flex items-start gap-1.5 pr-6">
                        <span class="font-bold shrink-0">課題:</span>
                        <span>${escapeHtml(pair.issue)}</span>
                    </div>
                    <div class="text-xs text-emerald-300 flex items-start gap-1.5 pr-6">
                        <span class="font-bold shrink-0">解決策:</span>
                        <span>${escapeHtml(pair.solution)}</span>
                    </div>
                `;
                issuePairsList.appendChild(card);
            });
        }

        function renderTasks() {
            const dayData = getOrCreateDayData(currentDateStr);
            tasksList.innerHTML = '';

            const carriedTasks = [];
            Object.keys(appData).sort().forEach(dateKey => {
                if (dateKey < currentDateStr) {
                    (appData[dateKey].tasks || []).forEach(t => {
                        if (!t.completed) {
                            carriedTasks.push({ ...t, originalDate: dateKey, type: 'carried' });
                        }
                    });
                }
            });

            const todayTasks = (dayData.tasks || []).map(t => ({ ...t, originalDate: currentDateStr, type: 'today' }));

            const futureTasks = [];
            Object.keys(appData).sort().forEach(dateKey => {
                if (dateKey > currentDateStr) {
                    (appData[dateKey].tasks || []).forEach(t => {
                        if (!t.completed) {
                            futureTasks.push({ ...t, originalDate: dateKey, type: 'future' });
                        }
                    });
                }
            });

            const allTasks = [...carriedTasks, ...todayTasks, ...futureTasks];

            if (allTasks.length === 0) {
                tasksList.innerHTML = `<div class="text-center py-4 bg-[#1A2336]/40 rounded-xl text-slate-500 text-xs">登録されているタスクはありません</div>`;
                return;
            }

            allTasks.forEach((task) => {
                const taskEl = document.createElement('div');
                
                let cardStyle = "bg-[#1A2336] border-slate-700/60";
                let badgeMarkup = "";

                if (task.type === 'carried') {
                    cardStyle = "bg-amber-950/20 border-amber-800/50 hover:border-amber-600/70";
                    badgeMarkup = `<span class="inline-flex items-center gap-1 text-[10px] font-bold text-amber-400 bg-amber-900/40 px-2 py-0.5 rounded border border-amber-700/50">
                        <i data-lucide="clock" class="w-3 h-3"></i> ${task.originalDate}から持ち越し
                    </span>`;
                } else if (task.type === 'future') {
                    cardStyle = "bg-purple-950/20 border-purple-800/50 hover:border-purple-600/70";
                    badgeMarkup = `<span class="inline-flex items-center gap-1 text-[10px] font-bold text-purple-300 bg-purple-900/40 px-2 py-0.5 rounded border border-purple-700/50">
                        <i data-lucide="moon" class="w-3 h-3"></i> ${task.originalDate}に実行予定
                    </span>`;
                } else {
                    cardStyle = "bg-[#1A2336] border-slate-700/60 hover:border-blue-500/50";
                    badgeMarkup = `<span class="inline-flex items-center gap-1 text-[10px] font-bold text-blue-400 bg-blue-900/30 px-2 py-0.5 rounded border border-blue-700/40">
                        <i data-lucide="target" class="w-3 h-3"></i> 本日実行
                    </span>`;
                }

                taskEl.className = `flex flex-col p-3 border rounded-xl gap-2 transition ${cardStyle} ${task.completed ? 'opacity-40' : ''}`;
                
                if (task.isEditing) {
                    taskEl.innerHTML = `
                        <div class="flex items-center gap-2">
                            <input type="text" id="edit-input-${task.id}" value="${escapeHtml(task.text)}" class="w-full bg-[#0B0F19] border border-blue-500 rounded px-2 py-1 text-sm text-slate-100">
                            <button onclick="confirmEditTask('${task.originalDate}', '${task.id}')" class="text-xs bg-blue-600 text-white px-2.5 py-1 rounded">確定</button>
                        </div>
                    `;
                } else {
                    taskEl.innerHTML = `
                        <div class="flex items-center justify-between gap-2">
                            ${badgeMarkup}
                            <div class="flex items-center gap-1 shrink-0">
                                ${task.type === 'today' ? `
                                    <button onclick="startEditTask('${task.originalDate}', '${task.id}')" class="p-1 text-slate-400 hover:text-blue-400"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>
                                ` : ''}
                                <button onclick="deleteUnifiedTask('${task.originalDate}', '${task.id}')" class="p-1 text-slate-400 hover:text-rose-400" title="削除"><i data-lucide="x" class="w-4 h-4"></i></button>
                            </div>
                        </div>

                        <div class="flex items-center gap-2.5 min-w-0 flex-1">
                            <button onclick="toggleUnifiedTask('${task.originalDate}', '${task.id}', '${task.type}')" class="w-5 h-5 rounded-full border flex items-center justify-center shrink-0 transition ${
                                task.completed ? 'bg-blue-600 border-blue-600 text-white' : 
                                (task.type === 'carried' ? 'border-amber-500 text-transparent hover:bg-amber-500/20' : 
                                (task.type === 'future' ? 'border-purple-500 text-transparent hover:bg-purple-500/20' : 'border-slate-500 text-transparent hover:bg-blue-500/20'))
                            }">
                                <i data-lucide="check" class="w-3.5 h-3.5"></i>
                            </button>
                            <span class="text-sm font-medium text-slate-200 truncate ${task.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(task.text)}</span>
                        </div>
                    `;
                }
                tasksList.appendChild(taskEl);
            });
        }

        function renderInsightsTimeline() {
            insightsTimeline.innerHTML = '';
            const list = [];

            Object.keys(appData).sort().reverse().forEach(dateKey => {
                const text = appData[dateKey].insights;
                if (text && text.trim()) list.push({ date: dateKey, text });
            });

            if (list.length === 0) {
                insightsTimeline.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs">学びの記録がここに表示されます</div>`;
                return;
            }

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'p-3 bg-[#1A2336] border border-slate-700/50 rounded-xl space-y-1';
                card.innerHTML = `
                    <div class="text-[11px] font-semibold text-amber-400 flex items-center gap-1">
                        <i data-lucide="calendar" class="w-3 h-3"></i>
                        ${item.date}
                    </div>
                    <p class="text-xs text-slate-200 leading-relaxed whitespace-pre-wrap">${escapeHtml(item.text)}</p>
                `;
                insightsTimeline.appendChild(card);
            });
        }

        function setupEventListeners() {
            datePicker.addEventListener('change', (e) => {
                currentDateStr = e.target.value;
                renderAll();
            });
            prevDayBtn.addEventListener('click', () => changeDate(-1));
            nextDayBtn.addEventListener('click', () => changeDate(1));
            todayBtn.addEventListener('click', () => {
                currentDateStr = getTodayString();
                datePicker.value = currentDateStr;
                renderAll();
            });

            const handleInput = (field, val) => {
                getOrCreateDayData(currentDateStr)[field] = val;
                saveData();
                if (field === 'insights') renderInsightsTimeline();
            };

            reflectionJournal.addEventListener('input', (e) => handleInput('journal', e.target.value));
            reflectionInsights.addEventListener('input', (e) => handleInput('insights', e.target.value));
            reflectionGood.addEventListener('input', (e) => handleInput('good', e.target.value));

            taskTargetDateType.addEventListener('change', (e) => {
                if (e.target.value === 'custom') {
                    taskCustomDate.classList.remove('hidden');
                    taskCustomDate.value = currentDateStr;
                } else {
                    taskCustomDate.classList.add('hidden');
                }
            });

            addIssuePairBtn.addEventListener('click', () => {
                const issue = issueInput.value.trim();
                const solution = solutionInput.value.trim();
                if (!issue && !solution) return;

                const dayData = getOrCreateDayData(currentDateStr);
                dayData.issuePairs.push({
                    id: 'pair_' + Date.now(),
                    issue: issue,
                    solution: solution
                });

                issueInput.value = '';
                solutionInput.value = '';
                saveData();
                renderIssuePairs();
                lucide.createIcons();
            });

            taskInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') e.preventDefault(); });
            addTaskBtn.addEventListener('click', addNewTask);

            askAiBtn.addEventListener('click', generatePersonalizedAdvice);

            manualSaveBtn.addEventListener('click', () => {
                saveData();
                showToast('保存しました！');
            });

            shareBtn.addEventListener('click', shareTodayJournal);

            exportDataBtn.addEventListener('click', () => {
                const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `journal_backup_${getTodayString()}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('全データをバックアップ保存しました');
            });

            importDataFile.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        appData = imported;
                        saveData();
                        renderAll();
                        showToast('データを復元しました！');
                    } catch (err) {
                        alert('無効なファイル形式です');
                    }
                };
                reader.readAsText(file);
            });

            // スマホ初期画面設定
            if (window.innerWidth < 1024) {
                switchMobileTab('journal');
            }
        }

        // 具体的かつ客観的なAIアドバイス生成ロジック（全肯定の排除）
        function generatePersonalizedAdvice() {
            const dayData = getOrCreateDayData(currentDateStr);
            aiResponseContainer.classList.remove('hidden');
            aiResponseText.textContent = "AIアドバイザーが文章のロジック、課題設定の妥当性、改善点を分析中...";

            setTimeout(() => {
                const journal = dayData.journal || '';
                const insights = dayData.insights || '';
                const good = dayData.good || '';
                const issuePairs = dayData.issuePairs || [];
                
                const fullText = (journal + ' ' + insights + ' ' + good).toLowerCase();

                let response = `【分析と客観的フィードバック】\n\n`;

                // 1. 思考・振り返りの質の検証（どこが良いか具体的に）
                response += `1. 記述内容の客観的評価\n`;
                if (journal.length > 30 || insights.length > 30) {
                    response += `・良い点: 出来事に対して「何が起きたか」だけでなく、自分の認知や学び（「${insights.slice(0, 20)}...」など）まで掘り下げて言語化できている点が優れています。感情と事実が具体的に整理されています。\n`;
                } else if (journal.length > 0 || insights.length > 0) {
                    response += `・現状の評価: 記述がまだ短く、概要にとどまっています。「なぜそう感じたのか」「どうしてその結果になったのか」という因果関係まで残すと、後から見返した際の再現性が高まります。\n`;
                } else {
                    response += `・注意点: 感想・気づきの入力が未入力、または非常に短いです。AI分析の精度を上げるために、まずは今日の出来事や感情を数行書き出してみてください。\n`;
                }
                response += `\n`;

                // 2. 課題と解決策のロジック検証（甘さやズレの指摘）
                response += `2. 課題・解決策の妥当性と懸念点\n`;
                if (issuePairs.length > 0) {
                    issuePairs.forEach((p, idx) => {
                        response += `[課題 ${idx + 1}] 「${p.issue}」\n`;
                        response += `[解決策] 「${p.solution}」\n`;
                        
                        // 解決策の解像度チェック
                        if (p.solution.includes("頑張る") || p.solution.includes("意識する") || p.solution.length < 10) {
                            response += `・【指摘・改善案】: 解決策が「意識」や「根性」に依存しています。意志の力は途切れやすいため、具体的に『いつ・どこで・何のツールを使ってやるか』という環境設定や数値目標（例: 25分タイマーをセットする等）に落とし込んでください。\n`;
                        } else {
                            response += `・【分析】: 具体的な行動ステップが提示されています。ただし、実践する時間帯やトリガー（例: 朝起きてすぐ等）が未定の場合は途絶えるリスクがあります。\n`;
                        }
                    });
                    response += `\n`;
                } else {
                    response += `・【指摘】: 現在「課題と解決策」が登録されていません。問題を感じつつも打ち手が曖昧な状態の可能性があります。ボトルネックを1つに絞り、具体的な打ち手を登録することをお勧めします。\n\n`;
                }

                // 3. 具体的な改善アクション
                response += `3. 今後に向けた具体的アクション\n`;
                if (fullText.includes("集中") || fullText.includes("時間") || fullText.includes("疲")) {
                    response += `・時間の切り売りではなく「エネルギー管理」にシフトしてください。疲れを感じてから休むのではなく、集中力が切れる前のタイマー管理（ポモドーロ等）を取り入れるべきです。\n\n`;
                } else {
                    response += `・立てた解決策を実行可能な「明日のタスク一覧」に落とし込み、ハードルを極限まで下げて着手してください。\n\n`;
                }

                // 4. モチベーションメッセージ
                response += `4. 思考の指針\n`;
                response += `『計画の価値は、その実行と客観的な検証の中にある』\n`;
                response += `感情に流されず、現状の課題を冷静に分析できていることは大きな強みです。指摘した改善点を反映させ、着実に行動へ繋げていきましょう。`;

                dayData.aiAnalysis = response;
                saveData();
                aiResponseText.textContent = response;
            }, 600);
        }

        function addNewTask() {
            const text = taskInput.value.trim();
            if (!text) return;

            let targetDateStr = currentDateStr;
            const type = taskTargetDateType.value;
            
            if (type === 'tomorrow') {
                targetDateStr = getOffsetDateString(currentDateStr, 1);
            } else if (type === 'custom' && taskCustomDate.value) {
                targetDateStr = taskCustomDate.value;
            }

            getOrCreateDayData(targetDateStr).tasks.push({
                id: 'task_' + Date.now(),
                text: text,
                completed: false,
                createdDate: currentDateStr
            });

            taskInput.value = '';
            saveData();
            renderTasks();
            lucide.createIcons();

            if (targetDateStr === currentDateStr) {
                showToast('タスクを追加しました');
            } else {
                showToast(`タスクを [${targetDateStr}] 用として設定しました！`);
            }
        }

        function generateShareText() {
            const dayData = getOrCreateDayData(currentDateStr);
            let text = `🌙 【${currentDateStr} の振り返り】\n\n`;
            
            if (dayData.journal) text += `💬 今日の感想:\n${dayData.journal}\n\n`;
            if (dayData.insights) text += `💡 気づいたこと:\n${dayData.insights}\n\n`;
            
            if (dayData.issuePairs && dayData.issuePairs.length > 0) {
                text += `🎯 課題と解決策:\n`;
                dayData.issuePairs.forEach(p => {
                    if (p.issue) text += `・課題: ${p.issue}\n`;
                    if (p.solution) text += `  解決策: ${p.solution}\n`;
                });
                text += `\n`;
            }

            if (dayData.good) text += `😊 よかったこと:\n${dayData.good}\n\n`;

            if (dayData.tasks && dayData.tasks.length > 0) {
                text += `📋 タスク:\n`;
                dayData.tasks.forEach(t => {
                    text += `${t.completed ? '✓' : '○'} ${t.text}\n`;
                });
            }

            return text;
        }

        function shareTodayJournal() {
            const text = generateShareText();

            if (navigator.share) {
                navigator.share({
                    title: `${currentDateStr} の振り返り`,
                    text: text
                }).then(() => {
                    showToast('共有しました');
                }).catch((err) => {
                    if (err.name !== 'AbortError') copyToClipboard(text);
                });
            } else {
                copyToClipboard(text);
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('振り返り内容をコピーしました！');
            }).catch(() => {
                alert('コピーに失敗しました');
            });
        }

        window.deleteIssuePair = function(pairId) {
            const dayData = getOrCreateDayData(currentDateStr);
            dayData.issuePairs = dayData.issuePairs.filter(p => p.id !== pairId);
            saveData();
            renderIssuePairs();
            lucide.createIcons();
        };

        function changeDate(days) {
            const date = new Date(currentDateStr);
            date.setDate(date.getDate() + days);
            currentDateStr = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            datePicker.value = currentDateStr;
            renderAll();
        }

        window.toggleUnifiedTask = function(originalDate, taskId, taskType) {
            if (taskType === 'carried') {
                if (appData[originalDate]) {
                    const task = appData[originalDate].tasks.find(t => t.id === taskId);
                    if (task) {
                        appData[originalDate].tasks = appData[originalDate].tasks.filter(t => t.id !== taskId);
                        getOrCreateDayData(currentDateStr).tasks.push({ ...task, completed: true });
                        saveData();
                        renderTasks();
                        lucide.createIcons();
                        showToast('持ち越しタスクを完了しました！ 🎉');
                    }
                }
            } else {
                const dayData = getOrCreateDayData(originalDate);
                const task = dayData.tasks.find(t => t.id === taskId);
                if (task) {
                    task.completed = !task.completed;
                    saveData();
                    renderTasks();
                    lucide.createIcons();
                    if (task.completed) {
                        showToast('タスクを完了しました！ 🎉');
                    }
                }
            }
        };

        window.deleteUnifiedTask = function(originalDate, taskId) {
            if (appData[originalDate]) {
                appData[originalDate].tasks = appData[originalDate].tasks.filter(t => t.id !== taskId);
                saveData();
                renderTasks();
                lucide.createIcons();
                showToast('タスクを削除しました');
            }
        };

        window.startEditTask = function(originalDate, taskId) {
            const dayData = getOrCreateDayData(originalDate);
            dayData.tasks.forEach(t => t.isEditing = (t.id === taskId));
            renderTasks();
        };

        window.confirmEditTask = function(originalDate, taskId) {
            const input = document.getElementById(`edit-input-${taskId}`);
            const dayData = getOrCreateDayData(originalDate);
            const task = dayData.tasks.find(t => t.id === taskId);
            if (task && input) {
                if (input.value.trim()) task.text = input.value.trim();
                delete task.isEditing;
                saveData();
                renderTasks();
                lucide.createIcons();
            }
        };

        function showToast(msg) {
            document.getElementById('toast-message').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
        }

        function escapeHtml(str) {
            return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
        }
    </script>
</body>
</html>
